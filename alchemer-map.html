<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kies een locatie</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div class="info">Klik op de kaart om een locatie te kiezen.</div>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script>
    // Centrum op Heusden
    const heusdenCenter = [51.0378, 3.8075];

    // Begrenzing rond Heusden / directe omgeving
    const heusdenBounds = L.latLngBounds(
      [51.0150, 3.7700],  // zuidwest
      [51.0550, 3.8450]   // noordoost
    );

    const map = L.map('map', {
      center: heusdenCenter,
      zoom: 14,
      minZoom: 14,
      maxZoom: 18,
      maxBounds: heusdenBounds,
      maxBoundsViscosity: 1.0
    });

    let marker = null;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      noWrap: true,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', function (e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
      }

      window.parent.postMessage(
        {
          type: 'map-selection',
          lat: lat,
          lng: lng
        },
        '*'
      );
    });
  </script>
</body>
</html>
